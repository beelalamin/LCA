name: Deploy Adda Inventory Hub Assets

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend assets
        run: |
          npm install
          npm run build

      - name: Sync files to server using rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --omit-dir-times --no-perms --exclude='.env' --exclude='storage/' --exclude='bootstrap/cache/' --exclude='vendor/' --exclude='.git/' --exclude='.github/' --exclude='node_modules/'
          path: ./
          remote_path: /home/addainventoryhub-lca/htdocs/lca.addainventoryhub.com
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }} # Uses root secret
          remote_key: ${{ secrets.SSH_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Run post-deploy commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }} # Uses root secret
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Target the correct active application path
            APP_DIR="/home/addainventoryhub-lca/htdocs/lca.addainventoryhub.com"
            cd $APP_DIR

            echo "📦 Installing server-side dependencies..."
            php8.3 /usr/local/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "🧹 Clearing and caching configurations..."
            php8.3 artisan optimize:clear
            php8.3 artisan config:cache
            php8.3 artisan event:cache
            php8.3 artisan route:cache
            php8.3 artisan view:cache

            echo "⚡ Re-publishing Filament & Livewire assets to prevent breaks..."
            php8.3 artisan vendor:publish --force --tag=livewire:assets
            php8.3 artisan filament:assets

            echo "🔧 Running migrations..."
            php8.3 artisan migrate --force

            echo "🔒 Creating runtime directories and ensuring structural safety..."
            mkdir -p bootstrap/cache storage/framework/{cache,sessions,testing,views} storage/app/public storage/logs

            echo "👑 Resetting permissions from root back to the CloudPanel site owner..."
            chown -R addainventoryhub-lca:addainventoryhub-lca $APP_DIR
            chmod -R 775 storage bootstrap/cache

            echo "🔄 Restarting queue worker & PHP-FPM..."
            sudo supervisorctl restart laravel-worker:* || true
            sudo systemctl restart php8.3-fpm || true

            echo "✅ Deployment completed successfully!"
